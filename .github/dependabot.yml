# Weekly dependency updates. Values are pinned by
# scripts/check-dependabot-config.sh; see
# docs/architecture/03-Engineering-Workflow.md § Dependency Updates.
# Security updates are enabled in the repo settings and skip the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
