name: decision-ids

on:
  pull_request:
    types: [labeled]

concurrency:
  group: decision-ids-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  statuses: write
  pull-requests: write

jobs:
  number:
    if: >-
      github.event.label.name == 'ready-to-merge' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch main
        run: git fetch origin main
      - name: Number pending decisions
        run: bash scripts/number-decisions.sh
      - name: Commit and push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(decisions): number pending decisions"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Run ledger gates
        id: gates
        run: |
          if bash scripts/check-decision-ids.sh && bash scripts/check-decision-pending.sh; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi
      - name: Post decision-ledger status
        env:
          STATE: ${{ steps.gates.outputs.state }}
        run: |
          sha=$(git rev-parse HEAD)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
            -f state="${STATE}" \
            -f context="decision-ledger" \
            -f description="Decision ledger checks" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Remove label
        if: always()
        run: gh pr edit "$PR_NUMBER" --remove-label ready-to-merge
      - name: Fail on gate failure
        if: steps.gates.outputs.state == 'failure'
        run: exit 1
