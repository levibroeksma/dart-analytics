name: graph

on:
  push:
    branches: [main]
    paths-ignore:
      - 'graphify-out/**'
  pull_request:
    branches: [main]

concurrency:
  group: graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install graphify
        run: pip install 'graphifyy[sql]>=0.9.32,<0.10'

      - name: Snapshot committed graph
        run: cp graphify-out/graph.json /tmp/graph-before.json

      - name: Refresh knowledge graph
        run: GRAPH_REFRESH_STRICT=1 bash scripts/refresh-graph.sh

      - name: Compute delta
        id: delta
        run: |
          {
            echo "output<<GRAPH_DELTA_EOF"
            python3 scripts/graph-delta.py /tmp/graph-before.json graphify-out/graph.json
            echo "GRAPH_DELTA_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet graphify-out/graph.json; then
            echo "graph already current"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write PR body
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "Knowledge graph rebuilt from \`main\` @ ${{ github.sha }}."
            echo
            echo '```'
            printf '%s\n' "${{ steps.delta.outputs.output }}"
            echo '```'
          } > /tmp/graph-pr-body.md

      - name: Commit refreshed graph onto the reused branch
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C chore/graph-refresh
          git add graphify-out/graph.json
          git commit -m "chore(graph): refresh knowledge graph"
          git push --force origin chore/graph-refresh

      - name: Open or update the refresh PR
        if: steps.check.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/graph-pr-body.md", "utf8");
            const title = "chore(graph): refresh knowledge graph";

            const { data: existing } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:chore/graph-refresh`,
              base: "main",
            });

            let pr;
            if (existing.length > 0) {
              pr = existing[0];
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.notice(`Updated existing graph refresh PR #${pr.number}`);
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                head: "chore/graph-refresh",
                base: "main",
                body,
              });
              pr = created;
              core.notice(`Opened graph refresh PR #${pr.number}`);
            }

            try {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                    clientMutationId
                  }
                }`,
                { id: pr.node_id }
              );
              core.notice("Auto-merge enabled on the refresh PR.");
            } catch (err) {
              core.notice(
                `Auto-merge not enabled (repo setting off, or branch protection ` +
                `requirements unmet): ${err.message}`
              );
            }

  delta:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install graphify
        run: pip install 'graphifyy[sql]>=0.9.32,<0.10'

      - name: Snapshot committed graph
        run: cp graphify-out/graph.json /tmp/graph-before.json

      - name: Rebuild knowledge graph
        run: GRAPH_REFRESH_STRICT=1 bash scripts/refresh-graph.sh

      - name: Compute delta and render comment body
        id: delta
        run: |
          DELTA_OUTPUT="$(python3 scripts/graph-delta.py /tmp/graph-before.json graphify-out/graph.json)"
          echo "$DELTA_OUTPUT"

          OLD_NODES=$(echo "$DELTA_OUTPUT" | grep '^nodes:' | sed -E 's/.*old=([0-9]+).*/\1/')
          NEW_NODES=$(echo "$DELTA_OUTPUT" | grep '^nodes:' | sed -E 's/.*new=([0-9]+).*/\1/')
          NODE_DELTA=$(echo "$DELTA_OUTPUT" | grep '^nodes:' | sed -E 's/.*delta=([+-][0-9]+).*/\1/')
          OLD_LINKS=$(echo "$DELTA_OUTPUT" | grep '^links:' | sed -E 's/.*old=([0-9]+).*/\1/')
          NEW_LINKS=$(echo "$DELTA_OUTPUT" | grep '^links:' | sed -E 's/.*new=([0-9]+).*/\1/')
          LINK_DELTA=$(echo "$DELTA_OUTPUT" | grep '^links:' | sed -E 's/.*delta=([+-][0-9]+).*/\1/')

          {
            echo "<!-- graph-delta -->"
            echo "**Knowledge graph delta:** ${NODE_DELTA} nodes, ${LINK_DELTA} links"
            echo "Committed ${OLD_NODES} / ${OLD_LINKS} → rebuilt ${NEW_NODES} / ${NEW_LINKS}"
            echo "The graph is refreshed automatically after merge (\`graph.yml\`)."
          } > /tmp/graph-delta-body.md

      - name: Post or update delta comment
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/graph-delta-body.md", "utf8");
            const marker = "<!-- graph-delta -->";

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
